<!DOCTYPE html>
<html>
<head>
  <title>Clipboard Text Converter</title>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <div class="header">
    <h3 data-i18n="headerTitle">Clipboard Text Converter</h3>
  </div>

  <div class="button-container">
    <button id="btnCapitalize" data-i18n="btnCapitalize">Sentence case</button>
    <button id="btnTitleCase" data-i18n="btnTitleCase">Title Case</button>
    <button id="btnUppercase" data-i18n="btnUppercase">UPPERCASE</button>
    <button id="btnLowercase" data-i18n="btnLowercase">lowercase</button>

    <hr class="separator">

    <button id="btnConstantCase" data-i18n="btnConstantCase">CONSTANT_CASE</button>
    <button id="btnPascalCase" data-i18n="btnPascalCase">PascalCase</button>
    <button id="btnCamelCase" data-i18n="btnCamelCase">camelCase</button>
    <button id="btnSnakeCase" data-i18n="btnSnakeCase">snake_case</button>
    <button id="btnDotCase" data-i18n="btnDotCase">dot.case</button>
    <button id="btnParamCase" data-i18n="btnParamCase">param-case</button>
    <button id="btnNoAccents" data-i18n="btnNoAccents">No accents</button>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
