<!DOCTYPE html>
<html>
<head>
  <title>Clipboard Text Converter</title>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
  </style>
</head>
<body>

  <div class="header">
    <h3>Clipboard Text Converter</h3>
  </div>

  <div class="button-container">
    <button id="btnCapitalize">Capitalize</button>
    <button id="btnTitleCase">Title Case</button>
    <button id="btnUppercase">UPPERCASE</button>
    <button id="btnLowercase">lowercase</button>

    <hr class="separator">

    <button id="btnPascalCase">PascalCase</button>
    <button id="btnCamelCase">camelCase</button>
    <button id="btnSnakeCase">snake_case</button>
    <button id="btnDotCase">dot.case</button>
    <button id="btnParamCase">param-case</button>
    <button id="btnNoAccents">No accents</button>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
